[project]
name = "blasphemy"
version = "0.1.0"
description = "Optimise epub books for readability via claude CLI"
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.18",
    "markdownify>=0.13",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "beautifulsoup4>=4.12",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
blasphemy = "blasphemy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blasphemy = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
